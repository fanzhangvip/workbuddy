[tool.ruff]
# 代码评审 P2-4：项目此前没有任何 lint/format 配置，风格全靠「写的人自觉」。
# 这里**刻意只开启「能发现真 bug」的规则**，不开风格类规则 ——
# 目的是让 CI 能拦住真问题（未定义名、未使用导入、可疑比较），
# 而不是制造几百条格式告警、逼着改一遍全部代码（那是另一个独立决定）。
line-length = 110
target-version = "py313"
exclude = [
    ".venv",
    "frontend",
    "backups",
    "导出",
    ".cache",
    "__pycache__",
]

[tool.ruff.lint]
# F  = Pyflakes（未定义名 / 未使用导入与变量 / 重复定义）
# E9 = 语法与运行时错误类（如 return 在函数外）
# B  = flake8-bugbear 中**只保留高价值子集**（见 ignore）
select = ["F", "E9", "B"]
ignore = [
    "E501",   # 行长（本项目大量中文注释，强行折叠反而降低可读性）
    "B008",   # FastAPI 的 Body(default={}) 是官方惯用法，不是可变默认值的误用
    "B904",   # raise ... from 的写法，存量较多，非本阶段目标
    "B905",   # zip(strict=) 属建议性
]
# F401（未使用导入）**从 2026-10-16 起开启**：此前全局关掉的理由是"本项目大量导入以
# 触发副作用"，但那次全仓清理后实测 **0 处**未使用导入 —— 真正的副作用导入只有
# `tests/_run_batch.py` 等三处，都用显式 `# noqa: F401` 标注了原因。
# 开着它，死导入就再也不会悄悄堆回来。

[tool.ruff.lint.per-file-ignores]
# 这些文件里未使用的导入是有意为之（sys.path 注入 / 兼容性再导出）
"backend/main.py" = ["F401"]
"tests/*" = ["F401", "F841"]     # 测试里常保留中间结果便于排障
